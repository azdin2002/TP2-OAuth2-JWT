spring.application.name=security-service
server.port=8088

# Durees de vie des tokens (en minutes)
jwt.access-token-minutes=5
jwt.refresh-token-minutes=30
jwt.issuer=security-service

# Cles RSA (generees avec RSAKeyPairToFile)
rsa.public-key=classpath:certs/publicKey.pem
rsa.private-key=classpath:certs/privateKey.pem
